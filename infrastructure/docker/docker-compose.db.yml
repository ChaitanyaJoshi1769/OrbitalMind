version: '3.9'

services:
  postgres:
    image: timescale/timescaledb:latest-pg14
    container_name: orbitalmind-postgres
    environment:
      POSTGRES_DB: orbitalmind
      POSTGRES_USER: orbitalmind
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-orbitalmind_dev}
      POSTGRES_INITDB_ARGS: "-c shared_preload_libraries=timescaledb,pg_stat_statements"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/database/migrations/001_init_schema.sql:/docker-entrypoint-initdb.d/001_init_schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbitalmind -d orbitalmind"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - orbitalmind
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "log_min_duration_statement=1000"
      - "-c"
      - "log_statement=all"

  pgbouncer:
    image: pgbouncer/pgbouncer:latest
    container_name: orbitalmind-pgbouncer
    environment:
      PGBOUNCER_DATABASES_HOST: postgres
      PGBOUNCER_DATABASES_PORT: 5432
      PGBOUNCER_DATABASES_USER: orbitalmind
      PGBOUNCER_DATABASES_PASSWORD: ${DATABASE_PASSWORD:-orbitalmind_dev}
      PGBOUNCER_DATABASES_DBNAME: orbitalmind
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: 1000
      PGBOUNCER_DEFAULT_POOL_SIZE: 25
      PGBOUNCER_MIN_POOL_SIZE: 5
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - orbitalmind
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U orbitalmind"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    container_name: orbitalmind-adminer
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - orbitalmind

volumes:
  postgres_data:
    driver: local

networks:
  orbitalmind:
    driver: bridge
